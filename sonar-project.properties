# SonarQube project identity
sonar.projectKey=ha-reminder
sonar.projectName=HA Reminder
sonar.sourceEncoding=UTF-8

# Python source, tests, and coverage generated by the CI workflow.
sonar.sources=custom_components/ha_reminder
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# Ignore interpreter-generated files; production source is intentionally not excluded.
sonar.exclusions=**/__pycache__/**,**/*.pyc

# Make the workflow wait for the configured quality gate.
sonar.qualitygate.wait=true
