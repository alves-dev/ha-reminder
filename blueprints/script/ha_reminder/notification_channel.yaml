blueprint:
  name: HA Reminder notification channel
  description: >-
    Creates an editable script that uses Home Assistant's persistent
    notifications. It displays the HA Reminder level in the title and returns
    the success response required by the integration.
  domain: script

fields:
  title:
    name: Reminder title
    description: Supplied by HA Reminder.
    required: true
    selector:
      text:
  description:
    name: Reminder details
    description: Optional details supplied by HA Reminder.
    required: false
    selector:
      text:
        multiline: true
  is_test:
    name: Channel test
    description: Supplied by HA Reminder when testing a configured channel.
    required: false
    selector:
      boolean:
  level:
    name: Notification level
    description: Supplied by HA Reminder as normal, high, or critical.
    required: false
    selector:
      select:
        options:
          - normal
          - high
          - critical
  reminder_id:
    name: Reminder ID
    description: Supplied by HA Reminder to identify the persistent notification.
    required: false
    selector:
      text:
  person_entity_id:
    name: Person entity ID
    description: Supplied by HA Reminder to keep each person's notification separate.
    required: false
    selector:
      text:

mode: queued
max: 10

sequence:
  - action: persistent_notification.create
    data:
      title: >-
        {{ '[Test] ' if is_test | default(false, true) else '' }}
        {{ '[' ~ (level | default('normal', true) | title) ~ '] '
          if level | default('normal', true) != 'normal' else '' }}
        {{ title | default('HA Reminder', true) }}
      message: >-
        {% set payload = {
          'title': title | default('HA Reminder', true),
          'description': description | default('', true),
          'reminder_id': reminder_id | default('', true),
          'person_entity_id': person_entity_id | default('', true),
          'todo_entity_id': todo_entity_id | default('', true),
          'todo_item_uid': todo_item_uid | default('', true),
          'level': level | default('normal', true),
          'attempt': attempt | default(none, true),
          'channel_priority': channel_priority | default(none, true),
          'created_at': created_at | default('', true),
          'due_at': due_at | default('', true),
          'is_test': is_test | default(false, true)
        } %}
        {{ 'This is a HA Reminder notification-channel test.'
          if (is_test | default(false, true))
          else (description | default('You have a pending reminder.', true)) }}

        **Received payload**

        ```json
        {{ payload | tojson(indent=2) }}
        ```
      notification_id: "ha_reminder_{{ reminder_id | default('channel_test', true) }}_{{ person_entity_id | default('unknown_person', true) }}"
  - variables:
      response:
        success: true
  - stop: Notification accepted by the selected notify entity.
    response_variable: response
