[project]
name = "ha-reminder"
version = "2026.11.0"
description = "Persistent, script-delivered reminders for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
license = { text = "MIT" }
authors = [{ name = "alves-dev" }]
dependencies = [
  "homeassistant==2026.10.4",
]

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.375",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
